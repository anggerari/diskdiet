name: Release

# Semantic releases with release-please:
#  1. Every push to main updates a "release PR" that bumps the version in
#     Cargo.toml and writes CHANGELOG.md from Conventional Commits
#     (feat: -> minor, fix: -> patch, feat!: -> major; prerelease while in beta).
#  2. Merging that PR tags the release and publishes a GitHub (pre)release.
#  3. The build job then attaches binaries for macOS and Linux.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # A PAT makes CI run on the release PR. Without it, close and reopen
          # the release PR once to trigger the required checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --features gui --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          OUT=dist
          NAME="diskdiet-${TAG}-${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release"
          mkdir -p "$OUT/$NAME"
          cp "$BIN/diskdiet" "$BIN/diskdiet-gui" README.md LICENSE "$OUT/$NAME/"
          tar -C "$OUT/$NAME" -czf "$OUT/$NAME.tar.gz" .
          if [ "${{ runner.os }}" = "macOS" ]; then
            scripts/bundle-macos.sh "$BIN/diskdiet-gui" "$OUT" "${TAG#v}"
            (cd "$OUT" && ditto -c -k --keepParent "Disk Diet.app" "diskdiet-app-${TAG}-${{ matrix.target }}.zip")
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            scripts/package-deb.sh "$BIN" "$OUT" "${TAG#v}" amd64
          fi
          cd "$OUT"
          for f in *.tar.gz *.zip *.deb; do
            [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la
      - name: Upload to release
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/*.deb dist/*.sha256 --clobber

  homebrew:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Update Homebrew tap (anggerari/homebrew-diskdiet)
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping tap update."
            exit 0
          fi
          mkdir sums
          gh release download "$TAG" --pattern '*.sha256' --dir sums
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/anggerari/homebrew-diskdiet.git" tap
          mkdir -p tap/Formula tap/Casks
          scripts/homebrew-formula.sh "$TAG" sums > tap/Formula/diskdiet.rb
          scripts/homebrew-cask.sh "$TAG" sums > tap/Casks/diskdiet.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/diskdiet.rb Casks/diskdiet.rb
          git commit -m "diskdiet ${TAG}" || exit 0
          git push
