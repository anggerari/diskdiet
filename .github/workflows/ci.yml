name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The job id and matrix names are required status checks on `main`.
  # Renaming them means updating branch protection too.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Shell scripts parse
        run: sh -n install.sh && sh -n scripts/bundle-macos.sh && sh -n scripts/homebrew-formula.sh && sh -n scripts/homebrew-cask.sh && sh -n scripts/package-deb.sh
      - name: Debian package installs and runs
        if: runner.os == 'Linux'
        run: |
          set -eu
          cargo build --features gui
          scripts/package-deb.sh target/debug dist 0.0.0-ci.1 amd64
          sudo apt-get install -y desktop-file-utils
          sudo apt-get install -y ./dist/diskdiet_0.0.0-ci.1_amd64.deb
          dpkg -s diskdiet | grep -q '^Version: 0.0.0~ci.1$'
          diskdiet --version
          test -x /usr/bin/diskdiet-gui
          desktop-file-validate /usr/share/applications/diskdiet.desktop
          sudo apt-get remove -y diskdiet
