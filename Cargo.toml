[package]
name = "diskdiet"
version = "0.1.0-beta.3"
edition = "2021"
description = "Put your storage on a diet: reclaim space from node_modules, build artifacts, package-manager caches and Docker"
license = "MIT"
repository = "https://github.com/anggerari/diskdiet"
readme = "README.md"
keywords = ["cli", "disk", "cleanup", "node_modules", "docker"]
categories = ["command-line-utilities", "filesystem"]

[features]
default = []
# The desktop app. Build with `cargo build --release --features gui`.
gui = ["dep:eframe", "dep:egui_extras"]

[[bin]]
name = "diskdiet"
path = "src/main.rs"

[[bin]]
name = "diskdiet-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
dirs = "5"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
ratatui = "0.30"
toml = "1"
trash = "5"
eframe = { version = "0.37", optional = true }
egui_extras = { version = "0.37", optional = true }

[profile.release]
lto = true
strip = true
codegen-units = 1
