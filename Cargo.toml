[package]
name = "diskdiet"
version = "0.1.0"
edition = "2021"
description = "Put your disk on a diet: reclaim space from node_modules, build artifacts, package-manager caches and Docker"
license = "MIT"
repository = "https://github.com/anggerari/diskdiet"
readme = "README.md"
keywords = ["cli", "disk", "cleanup", "node_modules", "docker"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
dirs = "5"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
